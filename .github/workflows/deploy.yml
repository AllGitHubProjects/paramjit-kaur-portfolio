name: Deploy to GitHub Pages

# Run on every push to main, plus a manual "Run workflow" button.
on:
  push:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN permissions required by the official Pages deploy action.
permissions:
  contents: read
  pages: write
  id-token: write

# Cancel an in-flight deploy if a new commit lands on main.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build site
        env:
          # Pages serves the site at https://<user>.github.io/<repo>/, so Vite
          # needs that prefix baked into asset URLs at build time.
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
